<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>OS Demo</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#1e2a33;color:white;}
#topbar{position:absolute;top:0;left:0;width:100%;height:30px;background:#0f172a;display:flex;align-items:center;padding-left:10px;}
#topbar .icon{margin-right:8px;font-size:18px;cursor:pointer;}
#taskbar{position:absolute;bottom:0;left:0;width:100%;height:40px;background:#0f172a;display:flex;align-items:center;padding-left:10px;}
#taskbar .start{width:80px;height:30px;background:#0078D7;color:white;border-radius:4px;display:flex;align-items:center;justify-content:center;margin-right:10px;}
#taskbar .icons{display:flex;gap:10px;}
.desktop{position:absolute;top:30px;bottom:40px;width:100%;background:#2e3b4e;}
.window{position:absolute;top:80px;left:120px;width:300px;height:200px;background:white;color:black;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);}
.window .titlebar{height:30px;background:#0078D7;color:white;display:flex;align-items:center;padding-left:10px;border-top-left-radius:8px;border-top-right-radius:8px;cursor:move;}
.window .content{padding:10px;}
.dock{position:absolute;bottom:50px;width:100%;height:60px;background:rgba(15,23,42,.8);display:flex;justify-content:center;align-items:center;}
.dock .icon{width:50px;height:50px;margin:0 10px;font-size:32px;cursor:pointer;}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const windows = document.querySelectorAll('.window');
  windows.forEach(win => {
    let isDragging = false;
    let offsetX = 0, offsetY = 0;
    const titlebar = win.querySelector('.titlebar');
    titlebar.addEventListener('mousedown', e => {
      isDragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
    });
    document.addEventListener('mousemove', e => {
      if (isDragging) {
        win.style.left = `${e.clientX - offsetX}px`;
        win.style.top = `${e.clientY - offsetY}px`;
      }
    });
    document.addEventListener('mouseup', () => { isDragging = false; });
  });
});
</script>
</head>
<body>
<div id='topbar'>
  <div class='icon'>🍎</div>
  <div class='icon'>📁</div>
  <div class='icon'>🔍</div>
</div>

<div class='desktop'>
  <div class='window' style='top:80px; left:120px;'>
    <div class='titlebar'>DemoApp</div>
    <div class='content'>
      <p>This is a demo window.</p>
    </div>
  </div>
</div>

<div id='taskbar'>
  <div class='start'>Start</div>
  <div class='icons'>
    <div>App1</div>
    <div>App2</div>
  </div>
</div>

<div class='dock'>
  <div class='icon'>🖥️</div>
  <div class='icon'>💾</div>
  <div class='icon'>🎵</div>
</div>

</body>
</html>
