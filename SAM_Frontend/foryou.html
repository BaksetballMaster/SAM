<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM — For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header>

<main>
<section class="screen" id="foryou" aria-labelledby="fy-title">
  <div class="stack" style="gap:32px">
    <div class="head">
      <div class="stack" style="gap:4px">
        <h1 id="fy-title">For you</h1>
        <p class="muted" id="fy-sub">Picked from your preferences. Start a chat anytime.</p>
      </div>
      <a class="btn primary" href="chat.html">Start a new chat with SAM</a>
    </div>
    <p class="note" id="fy-loading" role="status" hidden>Finding websites for you…</p>

    <div class="stack" id="sports-section">
      <h2>Sports websites for you</h2>
      <div class="grid" id="sport-cards"></div>
    </div>

    <div class="stack" id="vol-section">
      <h2>Volunteering websites for you</h2>
      <div class="grid" id="vol-cards"></div>
    </div>

    <div class="empty" id="extras-empty">
      <p class="muted">Pick a sport or a way to volunteer and SAM will find websites for you.</p>
      <a class="btn" href="survey.html">Edit preferences</a>
    </div>

    <div class="stack">
      <h2>Study resources</h2>
      <div class="grid" id="study-cards"></div>
    </div>
  </div>
</section>
</main>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/foryou.js"></script>
</body>
</html>
