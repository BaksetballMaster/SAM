<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM — Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header>

<main>
<section class="screen" id="resources" aria-labelledby="res-title">
  <div class="stack" style="gap:32px">
    <div class="head">
      <div class="stack" style="gap:4px">
        <h1 id="res-title">Resources</h1>
        <p class="muted">Links shared by students and mentors, plus SAM’s study resources.</p>
      </div>
      <button class="btn primary" data-open-add>Add a resource</button>
    </div>
    <div class="stack">
      <h2>Shared by the community</h2>
      <div class="empty" id="shared-empty">
        <p class="muted">No one has shared a link yet. Add the first one with the + button.</p>
        <button class="btn" data-open-add>Add a resource</button>
      </div>
      <div class="grid" id="shared-cards"></div>
    </div>
    <div class="stack">
      <h2>Study resources</h2>
      <div class="grid" id="res-study-cards"></div>
    </div>
  </div>
</section>
</main>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/resources.js"></script>
</body>
</html>
