<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header>

<main>
<section class="screen" id="login" aria-labelledby="login-title">
  <div class="auth">
    <div class="stack" style="align-items:center;text-align:center;gap:8px">
      <div class="logo" aria-hidden="true">S</div>
      <h1 id="login-title">Welcome to SAM</h1>
      <p class="muted" id="login-sub">Sign in to see your resources, sports and volunteering picks.</p>
    </div>
    <button type="button" class="btn wide" id="google-btn">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 12h8"/></svg>
      Continue with Google
    </button>
    <div class="divider">or use email</div>
    <form id="login-form" class="stack" style="gap:14px" novalidate>
      <div class="field" id="name-field" hidden>
        <label for="name">First name</label>
        <input id="name" type="text" autocomplete="given-name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters">
      </div>
      <label class="small muted" id="consent-row" style="display:flex;gap:8px;align-items:flex-start" hidden>
        <input type="checkbox" id="consent" style="margin-top:4px;width:18px;height:18px">
        <span>If I’m under 13, a parent or guardian has agreed to let me use SAM.</span>
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <button type="button" class="btn primary" id="login-submit">Sign in</button>
    </form>
    <p class="small muted" style="text-align:center">
      <span id="switch-text">New to SAM?</span>
      <button type="button" class="linkish" id="switch-mode">Create an account</button>
    </p>
  </div>
</section>
</main>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
